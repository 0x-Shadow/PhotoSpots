name: Publish release

# Publishes a GitHub Release (with an installable APK attached) when a new app
# version lands on main, or when a version tag is pushed. The app checks this
# channel on launch.
#
# Flow:
#   Push to main (or push a `v*` tag). Nothing else is required: the job picks
#   the next free patch version, stamps it into the APK, publishes the release
#   and attaches the APK, which installed apps then offer as an in-app update.
#
#   `version:` in pubspec.yaml is the base version. If `v<version>` is already
#   released, the patch number is increased until the tag is free.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

# A push can match both the branch and the tag filters; run one at a time so the
# release asset upload cannot race itself.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            BASE=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            PATCH=${PATCH:-0}
            while gh release view "v$MAJOR.$MINOR.$PATCH" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
            done
            TAG="v$MAJOR.$MINOR.$PATCH"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to the version the project is developed against: newer stable
      # releases require a newer Android Gradle Plugin than android/settings.gradle.kts pins.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # Every release must be signed with the same long-lived key, otherwise
      # Android refuses to install the update over the previous version.
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; the APK would be debug-signed and could not update an installed app."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "KEYSTORE_ALIAS=$KEY_ALIAS"
            echo "KEYSTORE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=APP_VERSION="$VERSION"

      - name: Rename APK
        id: apk
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          OUT="photospot-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; will update its assets."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --latest
          fi

      - name: Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        shell: bash
        run: gh release upload "$TAG" "$APK" --clobber
